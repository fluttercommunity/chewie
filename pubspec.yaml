name: chewie
description: A video player for Flutter with Cupertino and Material play controls
version: 1.15.0
homepage: https://github.com/fluttercommunity/chewie

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.41.0"

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  video_player: ^2.11.1
  wakelock_plus: ^1.7.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Only for the fake platform the widget tests install, so the local player
  # actually initializes under `flutter test`.
  video_player_platform_interface: ^6.9.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
